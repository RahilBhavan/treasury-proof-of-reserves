name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.8.1'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run demo:adversarial
      - run: npm run build:web
      - run: node scripts/check-browser.mjs
      - run: node src/cli.js verify examples/bundle.json --offline
